  <div class="p08-preview-stage" id="p08-preview-stage">
    <section class="p08-window" id="p08-window" data-left="true" data-right="false" data-bottom="false" data-short-height="false" aria-label="Memorive 模型排行榜">
      <header class="p08-global-bar">
        <div class="p08-global-left">
          <button class="p08-icon-button" id="p08-toggle-left" type="button" aria-label="切换边栏" aria-pressed="true" data-p08-tip="切换边栏  Ctrl+B" data-p08-placement="bottom">
            <svg class="p08-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#p08-icon-panel-left"></use></svg>
          </button>
          <span class="p08-app-title">Memorive</span>
          <span class="p08-view-name" id="p08-view-name">主体界面</span>
        </div>
        <div class="p08-global-right">
          <button class="p08-icon-button" id="p08-toggle-bottom" type="button" aria-label="切换底部面板显示" aria-pressed="false" data-p08-tip="切换底部面板显示  Ctrl+J" data-p08-placement="bottom">
            <svg class="p08-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#p08-icon-panel-bottom"></use></svg>
          </button>
          <button class="p08-icon-button" id="p08-toggle-right" type="button" aria-label="显示或隐藏侧边面板" aria-pressed="false" data-p08-tip="显示/隐藏侧边面板  Ctrl+Alt+B" data-p08-placement="bottom">
            <svg class="p08-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#p08-icon-panel-right"></use></svg>
          </button>
        </div>
      </header>

      <div class="p08-workspace">
        <nav class="p08-navigation" aria-label="一级导航">
          <button class="p08-logo" id="p08-logo" type="button" aria-label="播放标识动效">
            <img class="p08-logo-image" src="assets/illustrations/常驻logo.svg" alt="Memorive 临时标识">
          </button>
          <div class="p08-nav-list">
            <button class="p08-nav-item" type="button" data-page="收件箱" aria-pressed="false">
              <svg class="p08-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#p08-icon-inbox"></use></svg><span>收件箱</span>
            </button>
            <button class="p08-nav-item" type="button" data-page="当前任务" aria-pressed="false">

            </button>
            <button class="p08-nav-item" type="button" data-page="消息" aria-pressed="false">

            </button>
            <button class="p08-nav-item" type="button" data-page="会话管理" aria-pressed="false">

              <svg class="p08-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#p08-icon-notebook-pen"></use></svg><span>工作日志</span>

              <svg class="p08-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#p08-icon-settings"></use></svg><span>设置</span>
            </button>
          </div>
        </nav>

        <main class="p08-central" id="p08-central">
          <div class="p08-page-view" id="p08-page-view" hidden>
            <div class="lb-content page-shell" id="lb-primary">
      <div class="lb-heading"><div class="lb-heading-title"><button class="icon-button p08-main-back" id="p08-return-main" type="button" aria-label="返回主界面" hidden>‹</button><h1 id="lb-page-title">模型排行榜</h1><button class="lb-updated" id="lb-updated" type="button" aria-label="上次更新与汇率" data-p08-placement="bottom"><time id="lb-updated-date">—</time></button></div><div class="lb-heading-tools" role="group" aria-label="排行榜操作"><button id="lb-starred-only" class="lb-icon-btn lb-star" type="button" aria-label="仅看星标" data-p08-tip="仅看星标" aria-pressed="false" aria-controls="lb-rows"><span data-lb-icon="star" aria-hidden="true"></span></button><button id="lb-currency" class="lb-icon-btn lb-currency-icon" type="button" aria-label="当前 USD，切换为 RMB" data-p08-tip="当前 USD，点击切换为 RMB">USD</button><button class="lb-icon-btn" type="button" id="lb-rule-toggle" aria-label="评分偏好" data-p08-tip="评分偏好" aria-expanded="false" aria-controls="lb-inspector"><span data-lb-icon="sliders-horizontal" aria-hidden="true"></span><span class="lb-draft-dot" id="lb-pref-dirty" aria-hidden="true" hidden></span></button><button class="lb-icon-btn" id="lb-refresh" type="button" aria-label="刷新排行榜" data-p08-tip="刷新排行榜"><span data-lb-icon="refresh-cw" aria-hidden="true"></span></button></div></div>
      <section class="lb-page-body" id="lb-ranking-panel" aria-label="模型排名列表">
      <div class="lb-meta"><div class="lb-meta-left"><span id="lb-context"></span></div><span class="lb-save-feedback" id="lb-save-feedback" hidden><span data-lb-icon="check" aria-hidden="true"></span>偏好已保存，排名已更新</span><button class="lb-link-btn" id="lb-clear-filters" type="button" hidden>清除筛选</button></div>
      <div class="lb-table-wrap"><table class="lb-table" aria-label="模型排行榜"><colgroup id="lb-column-widths"></colgroup><thead><tr id="lb-headers"></tr></thead><tbody id="lb-rows"></tbody></table></div>
      <div class="lb-foot"><span id="lb-price-caption"></span></div>
      </section>
    </div>
          </div>
          <div class="p08-blank-state" id="p08-blank-state"><div class="p08-home-prompt"><p class="p08-home-speech">想构建什么呢？</p><button class="p08-home-expression-button" type="button" data-expression="interaction" aria-label="播放疑问表情"><img class="p08-home-expression-image" src="assets/decorations/home-interaction.svg" alt="" draggable="false"></button></div></div>
          <div class="p08-page-placeholder" id="p08-page-placeholder" hidden><div class="p08-page-symbol" aria-hidden="true"><svg class="p08-icon" viewBox="0 0 24 24"><use href="#p08-icon-layout-top"></use></svg></div><div class="p08-page-copy" id="p08-page-copy"><h1 id="p08-page-title">页面</h1><p>请打开对应 Part 的独立预览文件</p></div></div>
        </main>

        <aside class="p08-right-panel lb-inspector" id="p08-right-panel" aria-label="模型详情或评分偏好" aria-hidden="true" inert>
      <div class="lb-inspector-inner">
        <header class="lb-inspector-head"><button class="lb-icon-btn" id="lb-inspector-back" type="button" aria-label="返回排行榜，取消未保存修改" data-p08-tip="返回排行榜"><span data-lb-icon="back" aria-hidden="true"></span></button><h2 id="lb-inspector-title">模型详情</h2><div class="lb-inspector-actions"><button class="lb-icon-btn" id="lb-reset-weights" type="button" aria-label="恢复默认偏好" data-p08-tip="恢复默认偏好" hidden><span data-lb-icon="rotate-ccw" aria-hidden="true"></span></button><button class="lb-icon-btn lb-primary" id="lb-pref-apply" type="button" aria-label="保存偏好" data-p08-tip="保存偏好" disabled hidden><span data-lb-icon="save" aria-hidden="true"></span></button><button class="lb-icon-btn" id="lb-inspector-close" type="button" aria-label="关闭边栏" data-p08-tip="关闭边栏"><span data-lb-icon="x" aria-hidden="true"></span></button></div></header>
        <section class="lb-inspector-content" id="lb-model-detail" aria-label="模型详情" hidden inert></section>
        <section class="lb-inspector-content" id="lb-rules" aria-label="评分偏好" hidden inert>
          <p class="lb-error" id="lb-pref-error" role="alert" hidden></p>
          <div class="lb-pref-grid">
            <section class="lb-pref-section" aria-labelledby="lb-source-title"><div class="lb-pref-section-head"><h3 id="lb-source-title">数据来源</h3></div><div class="lb-source-head" id="lb-source-head"><span>参与来源</span><span>评分权重</span><span>占比</span><span></span></div><div id="lb-source-rows"></div><p class="lb-small" id="lb-source-empty" hidden></p></section>
            <section class="lb-pref-section" aria-labelledby="lb-value-title"><div class="lb-pref-section-head"><h3 id="lb-value-title">性价比偏好</h3></div><div class="lb-value-weights"><label class="lb-field"><span>能力权重 <output id="lb-ability-pct"></output></span><input class="lb-input lb-weight" id="lb-ability-weight" type="number" min="0" max="1000" step="any" required value="70"></label><label class="lb-field"><span>成本权重 <output id="lb-price-pct"></output></span><input class="lb-input lb-weight" id="lb-price-weight" type="number" min="0" max="1000" step="any" required value="30"></label></div><label class="lb-field"><span>输入 / 输出 Token 比例</span><select id="lb-ratio" class="lb-select"><option value="0.8">4 : 1</option><option value="0.5">1 : 1</option><option value="0.2">1 : 4</option></select></label></section>
          </div>
        </section>
      </div>
    </aside>

        <section class="p08-bottom-panel p08-accounting-panel" id="p08-bottom-panel" aria-label="计费与用量" aria-hidden="true" inert data-metric="COST" data-accounting-version="r0.6">
  <div class="p08-accounting-toolbar">
    <strong class="p08-accounting-title"><svg aria-hidden="true"><use href="#p08-icon-accounting"></use></svg><span>计费与用量</span></strong>
    <label class="p08-accounting-filter p08-accounting-scope-filter">
      <svg aria-hidden="true"><use href="#p08-icon-crosshair"></use></svg>
      <span class="p08-sr-only">统计范围</span>
      <select id="p08-accounting-scope" aria-label="统计范围">
        <option value="ALL">全部记录</option>
        <option value="CURRENT_JOB" disabled>本任务（归属未完整）</option>
      </select>
    </label>
    <label class="p08-accounting-filter">
      <svg aria-hidden="true"><use href="#p08-icon-calendar-range"></use></svg>
      <span class="p08-sr-only">时间范围</span>
      <select id="p08-accounting-range" aria-label="时间范围">
        <option value="7D">近 7 天</option>
        <option value="30D" selected>近 30 天</option>
        <option value="MONTH">本月</option>
      </select>
    </label>
    <label class="p08-accounting-filter p08-accounting-model-filter">
      <svg aria-hidden="true"><use href="#p08-icon-models"></use></svg>
      <span class="p08-sr-only">模型</span>
      <select id="p08-accounting-model" aria-label="模型"><option value="ALL">全部模型</option></select>
    </label>
    <button class="p08-accounting-icon-button" id="p08-accounting-refresh" type="button" aria-label="立即刷新" title="立即刷新">
      <svg aria-hidden="true"><use href="#p08-icon-refresh"></use></svg>
    </button>
    <span class="p08-accounting-sync" id="p08-accounting-sync" aria-live="polite">等待同步</span>
    <button class="p08-accounting-icon-button" id="p08-accounting-close" type="button" aria-label="关闭底部面板" title="关闭">
      <svg aria-hidden="true"><use href="#p08-icon-close"></use></svg>
    </button>
  </div>

  <div class="p08-accounting-body">
    <div class="p08-accounting-metrics" role="tablist" aria-label="选择图表指标">
      <div class="p08-accounting-metric-row is-active" data-metric-row="COST">
        <button class="p08-accounting-metric-leading p08-accounting-currency" id="p08-accounting-currency" type="button" aria-label="当前 USD，点击切换为 RMB" title="切换显示币种">
          <svg aria-hidden="true"><use href="#p08-icon-cost"></use></svg><span id="p08-accounting-currency-code">USD</span>
        </button>
        <button class="p08-accounting-metric-main" id="p08-accounting-tab-cost" type="button" role="tab" aria-selected="true" aria-controls="p08-accounting-chart" data-metric="COST">
          <span class="p08-accounting-metric-label">费用（含估算）</span>
          <strong class="p08-accounting-metric-value" id="p08-accounting-cost">—</strong>
          <span class="p08-accounting-metric-note" id="p08-accounting-cost-note">实际 — · 估算 —</span>
        </button>
      </div>
      <div class="p08-accounting-metric-row" data-metric-row="REQUESTS">
        <span class="p08-accounting-metric-leading" aria-hidden="true"><svg><use href="#p08-icon-requests"></use></svg></span>
        <button class="p08-accounting-metric-main" id="p08-accounting-tab-requests" type="button" role="tab" aria-selected="false" aria-controls="p08-accounting-chart" data-metric="REQUESTS">
          <span class="p08-accounting-metric-label">请求次数</span>
          <strong class="p08-accounting-metric-value" id="p08-accounting-attempts">—</strong>
          <span class="p08-accounting-metric-note" id="p08-accounting-attempt-note">失败与重试也计入</span>
        </button>
      </div>
      <div class="p08-accounting-metric-row" data-metric-row="TOKENS">
        <span class="p08-accounting-metric-leading" aria-hidden="true"><svg><use href="#p08-icon-tokens"></use></svg></span>
        <button class="p08-accounting-metric-main" id="p08-accounting-tab-tokens" type="button" role="tab" aria-selected="false" aria-controls="p08-accounting-chart" data-metric="TOKENS">
          <span class="p08-accounting-metric-label">Tokens</span>
          <strong class="p08-accounting-metric-value" id="p08-accounting-tokens">—</strong>
          <span class="p08-accounting-metric-note" id="p08-accounting-token-note">输入 — · 输出 —</span>
        </button>
      </div>
    </div>

    <figure class="p08-accounting-chart" id="p08-accounting-chart" role="tabpanel" aria-labelledby="p08-accounting-tab-cost">
      <figcaption class="p08-accounting-chart-head">
        <span class="p08-accounting-chart-heading"><svg aria-hidden="true"><use id="p08-accounting-chart-icon" href="#p08-icon-cost"></use></svg><span id="p08-accounting-chart-title">每日费用</span><small id="p08-accounting-chart-unit">USD</small></span>
        <span class="p08-accounting-legend" id="p08-accounting-legend"></span>
      </figcaption>
      <div class="p08-accounting-plot" id="p08-accounting-plot">
        <svg id="p08-accounting-svg" role="img" aria-labelledby="p08-accounting-svg-title p08-accounting-svg-desc" preserveAspectRatio="none">
          <title id="p08-accounting-svg-title">近 30 天每日费用</title>
          <desc id="p08-accounting-svg-desc">按已配置模型统计的每日费用柱状图。</desc>
        </svg>
        <div class="p08-accounting-tooltip" id="p08-accounting-tooltip" role="tooltip" hidden></div>
        <div class="p08-accounting-empty" id="p08-accounting-empty" hidden>当前范围没有可显示数据</div>
      </div>
    </figure>
