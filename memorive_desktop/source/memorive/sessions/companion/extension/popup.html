<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extName">Memo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="popup-head">
      <p class="eyebrow">MEMO</p>
      <div class="language">
        <button id="language-button" class="language-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu" data-i18n-title="languageButton" data-i18n-aria-label="languageButton">Aa</button>
        <div id="language-menu" class="language-menu" role="menu" hidden></div>
      </div>
    </div>
    <h1 data-i18n="popupHeading"></h1>
    <p class="copy" data-i18n="popupIntro"></p>
    <div class="capture-actions">
      <button id="record-page" type="button" disabled data-i18n="recordStart"></button>
      <button id="test-current-page" class="secondary" type="button" disabled data-i18n="testRead"></button>
    </div>
    <p id="support-hint" class="boundary" data-i18n="unsupportedHint" hidden></p>
    <p id="record-status" role="status" class="copy" data-i18n="recordHint"></p>
    <p id="status" role="status"></p>
    <details class="sync-options">
      <summary data-i18n="siteSync"></summary>
      <p id="enabled-sites" class="copy"></p>
      <button id="sync-library" class="secondary" type="button" data-i18n="syncSelected"></button>
    </details>
  </main>
  <script src="site_profiles.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
