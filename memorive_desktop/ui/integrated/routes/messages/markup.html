<!-- The messages route: the message list, its filters and the message details in the right panel.
     The window frame around it is in page.html. -->
<section class="desktop-route-surface" data-desktop-route="messages" aria-label="消息" hidden>
<div id="desktop-messages-preview" class="desktop-page-root" lang="zh-Hans">
        <main class="desktop-central" id="desktop-central">
          <div class="desktop-page-view" id="desktop-page-view" hidden>
            <div class="page-shell desktop-messages-shell">
              <header class="page-header">
                <div class="desktop-page-heading-with-back"><button class="icon-button desktop-main-back" id="desktop-return-main" type="button" aria-label="返回主界面" data-desktop-tip="返回主界面" data-desktop-placement="right" hidden>‹</button><div class="page-heading"><p class="page-eyebrow" hidden></p><h2>消息 <span class="count-badge" id="messages-count" aria-label="当前显示 0 条消息">0</span></h2></div></div>
                <div class="toolbar-group desktop-messages-tools">
                  <div class="segmented desktop-icon-segmented" id="messages-mode" data-segmented aria-label="消息列表模式"><button class="desktop-toolbar-icon desktop-toolbar-ghost desktop-action-message" type="button" data-mode="current" aria-pressed="true" aria-label="当前消息" data-desktop-tip="当前消息">当前消息</button><button class="desktop-toolbar-icon desktop-toolbar-ghost desktop-action-archive" type="button" data-mode="history" aria-pressed="false" aria-label="历史消息" data-desktop-tip="历史消息">历史消息</button><button class="desktop-toolbar-icon desktop-toolbar-ghost desktop-action-star" type="button" data-mode="starred" aria-pressed="false" aria-label="星标消息" data-desktop-tip="星标消息">★ 星标消息</button></div>
                  <div class="desktop-messages-actions"><button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-mail-check" id="messages-read" type="button" aria-label="一键已读" data-desktop-tip="一键已读">一键已读</button><button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-batch" id="messages-bulk" type="button" aria-pressed="false" aria-label="批量管理" data-desktop-tip="批量管理">批量管理</button><button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-refresh" id="messages-refresh" type="button" aria-label="刷新" data-desktop-tip="刷新消息">↻</button></div>
                </div>
              </header>
              <div class="desktop-messages-batch" id="messages-batchbar" hidden>
                <div><strong id="messages-selected">已选 0 项</strong><span class="muted" id="messages-eligibility"> · 可已读 0 · 可确认 0</span></div>
                <div class="desktop-messages-batch-actions">
                  <button class="text-button" id="messages-select-visible" type="button">全选当前</button><button class="text-button" id="messages-clear-selected" type="button">清空已选</button>
                  <button class="soft-button" id="messages-star-add" type="button" disabled>加星</button><button class="soft-button" id="messages-star-remove" type="button" disabled>取消星标</button>
                  <button class="soft-button" id="messages-batch-read" type="button" disabled>标为已读 0 条</button><button class="primary-button" id="messages-batch-confirm" type="button" disabled>确认可处理消息</button>
                </div>
              </div>
<div class="page-body desktop-messages-body"><div class="desktop-messages-list" id="messages-list"></div><div class="empty-state" id="messages-empty"><div><strong>暂无消息</strong><span></span></div></div></div>
              <div class="toast" id="messages-toast" role="status" aria-live="polite" aria-atomic="true" hidden><span id="messages-toast-copy">消息状态已更新。</span><button class="text-button" type="button">关闭</button></div>
            </div>
          </div>
          <div class="desktop-blank-state" id="desktop-blank-state"><div class="desktop-home-prompt"><p class="desktop-home-speech">想构建什么呢？</p><button class="desktop-home-expression-button" type="button" data-expression="interaction" aria-label="播放疑问表情"><span class="desktop-home-expression-image desktop-kaomoji" aria-hidden="true">(・ω&lt;)☆</span></button></div></div>
          <div class="desktop-page-placeholder" id="desktop-page-placeholder" hidden><div class="desktop-page-symbol" aria-hidden="true"><svg class="desktop-icon" viewBox="0 0 24 24"><use href="#desktop-icon-layout-top"></use></svg></div><div class="desktop-page-copy" id="desktop-page-copy"><h1 id="desktop-page-title">页面</h1><p>请打开对应 Part 的独立预览文件</p></div></div>
        </main>

        <aside class="desktop-right-panel" id="desktop-right-panel" aria-label="消息详情" aria-hidden="true">
          <div class="inspector-inner desktop-messages-detail">
            <div class="inspector-head desktop-messages-inspector-head"><div class="desktop-messages-inspector-heading"><div class="desktop-messages-inspector-identity"><p class="inspector-kicker">消息详情</p><h3 id="messages-title" tabindex="-1">消息</h3></div></div><button class="icon-button desktop-detail-close" id="messages-close" type="button" aria-label="关闭详情" data-desktop-tip="关闭详情">×</button></div>
            <div class="desktop-messages-detail-meta"><span class="badge" id="messages-tone">状态</span><time id="messages-time">—</time></div>
            <div class="desktop-messages-detail-actions"><button class="soft-button" id="messages-detail-goto" type="button" hidden>前往</button><button class="primary-button" id="messages-detail-confirm" type="button" title="确认" hidden>确认</button><span class="badge" id="messages-detail-confirmed" hidden>已确认</span></div>
            <section class="inspector-section"><h4>消息内容</h4><p id="messages-summary">—</p></section>
            <section class="inspector-section" id="messages-locator-section"><h4>关联任务</h4><details class="desktop-copy-technical"><summary>技术详情</summary><p class="mono" id="messages-locator">—</p></details></section>
            <section class="inspector-section" id="messages-attachment" hidden><h4>附带文件</h4><div class="desktop-messages-attachment"><strong>运行报告.pdf</strong><br>PDF · 2.4 MB · 31 页<br><span class="muted">只读轻量预览</span></div></section>
            <p class="desktop-messages-detail-note"></p>
          </div>
        </aside>

        <button class="desktop-resizer desktop-right-resizer" id="desktop-resize-right" type="button" role="separator" aria-label="调整右侧面板宽度" aria-controls="desktop-right-panel" aria-orientation="vertical" aria-valuemin="160" aria-valuemax="440" aria-valuenow="390" hidden></button>
</div>
</section>
