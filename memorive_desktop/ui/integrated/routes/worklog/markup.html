<!-- The work log route: the entry list, its filter, and an entry's details in the right panel.
     The window frame around it is in page.html. -->
<section class="desktop-route-surface" data-desktop-route="work-log" aria-label="工作日志" hidden>
<div id="desktop-worklog-preview" class="desktop-page-root" lang="zh-Hans">
        <main class="desktop-central" id="desktop-central">
          <div class="desktop-page-view" id="desktop-page-view" hidden>
            <div class="page-shell desktop-worklog-shell">
              <header class="page-header">
                <div class="desktop-page-heading-with-back"><button class="icon-button desktop-main-back" id="desktop-return-main" type="button" aria-label="返回主界面" data-desktop-tip="返回主界面" data-desktop-placement="right" hidden>‹</button><div class="page-heading"><p class="page-eyebrow" hidden id="worklog-snapshot">实时任务活动</p><h2>工作日志 <span class="count-badge" id="worklog-count">0</span></h2></div></div>
                <div class="toolbar-group desktop-worklog-tools">
                  <div class="desktop-worklog-filter-wrap">
                    <button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-filter" id="worklog-filter-button" type="button" aria-haspopup="dialog" aria-controls="worklog-filter-popover" aria-expanded="false" aria-label="筛选工作日志" data-desktop-tip="筛选工作日志">筛选 ▾</button>
                    <div class="desktop-worklog-filter-popover" id="worklog-filter-popover" role="dialog" aria-label="筛选" hidden>
                      <strong class="desktop-worklog-filter-title">筛选</strong>
                      <fieldset><legend>时间范围</legend><label><input type="radio" name="worklog-time" value="today"> 今天</label><label><input type="radio" name="worklog-time" value="7" checked> 最近 7 天</label><label><input type="radio" name="worklog-time" value="30"> 最近 30 天</label><label><input type="radio" name="worklog-time" value="all"> 全部</label></fieldset>
                      <fieldset><legend>记录类型</legend><label><input type="radio" name="worklog-ledger" value="all" checked> 全部记录</label><label><input type="radio" name="worklog-ledger" value="branch"> 任务活动</label><label><input type="radio" name="worklog-ledger" value="central"> 中央摘要</label></fieldset>
                      <div class="toolbar-group desktop-worklog-filter-actions"><button class="text-button" id="worklog-reset" type="button">重置</button><button class="primary-button" id="worklog-apply" type="button">应用</button></div>
                    </div>
                  </div>
                  <button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-more" id="worklog-open-folder" type="button" aria-label="联动说明" data-desktop-tip="联动说明" hidden>联动说明</button>
                  <button class="icon-button desktop-worklog-refresh desktop-toolbar-icon desktop-toolbar-ghost desktop-action-refresh" id="worklog-refresh" type="button" data-pending="false" data-pending-count="0" aria-label="刷新" data-desktop-tip="刷新当前稳定视图">↻</button>
                </div>
              </header>
<div class="page-body desktop-worklog-body"><div class="desktop-worklog-list" id="worklog-list"></div><div class="empty-state" id="worklog-empty"><div><strong>当前筛选范围内没有工作日志</strong></div></div></div><div class="toast" id="worklog-toast" hidden><span id="worklog-toast-copy">只读定位已请求。</span><button class="text-button" type="button">关闭</button></div>
            </div>
          </div>
          <div class="desktop-blank-state" id="desktop-blank-state"><div class="desktop-home-prompt"><p class="desktop-home-speech">想构建什么呢？</p><button class="desktop-home-expression-button" type="button" data-expression="interaction" aria-label="播放疑问表情"><span class="desktop-home-expression-image" aria-hidden="true"></span></button></div></div>
          <div class="desktop-page-placeholder" id="desktop-page-placeholder" hidden><div class="desktop-page-symbol" aria-hidden="true"><svg class="desktop-icon" viewBox="0 0 24 24"><use href="#desktop-icon-layout-top"></use></svg></div><div class="desktop-page-copy" id="desktop-page-copy"><h1 id="desktop-page-title">页面</h1><p>请打开对应 Part 的独立预览文件</p></div></div>
        </main>

        <aside class="desktop-right-panel" id="desktop-right-panel" aria-label="日志账本详情" aria-hidden="true">
          <div class="inspector-inner">
            <div class="inspector-head desktop-worklog-inspector-head"><div class="desktop-worklog-inspector-heading"><div class="desktop-worklog-inspector-identity"><p class="inspector-kicker" id="worklog-detail-type">任务记录</p><h3 id="worklog-detail-title" tabindex="-1">账本</h3><p class="desktop-worklog-detail-date" id="worklog-detail-headline">—</p></div></div><button class="icon-button desktop-detail-close" id="worklog-close" type="button" aria-label="关闭详情" data-desktop-tip="关闭详情">×</button></div>
            <div class="toolbar-group desktop-worklog-detail-actions"><button class="soft-button" id="worklog-locate" type="button">查看当前任务</button><button class="text-button" id="worklog-open-current-folder" type="button">查看资料库成品</button></div>
            <div class="desktop-worklog-parse-banner" id="worklog-parse-banner" hidden></div>
            <section class="inspector-section"><h4>活动记录</h4><dl class="key-value"><dt>日期</dt><dd id="worklog-detail-date">—</dd><dt>任务状态</dt><dd id="worklog-detail-state">—</dd><dt>更新时间</dt><dd id="worklog-detail-modified">—</dd></dl></section>
            <details class="desktop-copy-technical"><summary>技术详情</summary><span class="mono" id="worklog-detail-id">—</span></details><section class="inspector-section" id="worklog-summary-section"><h4>当前摘要</h4><p id="worklog-detail-summary">—</p></section>
            <section class="inspector-section" id="worklog-milestones-section"><h4>处理记录</h4><div class="desktop-worklog-milestones" id="worklog-milestones"></div></section>
            <section class="inspector-section" id="worklog-receipt-section"><h4>中央待汇入与回执</h4><p id="worklog-receipt-status">中央日志待汇入</p><div class="desktop-worklog-chain"><span>branch event</span><b>›</b><span>central log</span><b>›</b><span>branch receipt</span></div></section>
          </div>
        </aside>

        <button class="desktop-resizer desktop-right-resizer" id="desktop-resize-right" type="button" role="separator" aria-label="调整一级列表与二级工作日志详情宽度，默认 60% / 40%" aria-controls="desktop-right-panel" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="760" aria-valuenow="498" hidden></button>
</div>
</section>
