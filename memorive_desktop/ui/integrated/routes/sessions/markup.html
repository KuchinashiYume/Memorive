<!-- The session management route: sessions by source, a session's turns, capture and refinement controls.
     The window frame around it is in page.html. -->
<section class="desktop-route-surface" data-desktop-route="sessions" aria-label="会话管理" hidden>
<div id="desktop-sessions-preview" class="desktop-page-root" lang="zh-Hans">
        <main class="desktop-central" id="desktop-central">
          <div class="desktop-page-view" id="desktop-page-view" hidden>
            <div class="page-shell desktop-sessions-shell">
              <header class="page-header">
                <div class="desktop-page-heading-with-back"><button class="icon-button desktop-main-back" id="desktop-return-main" type="button" aria-label="返回主界面" data-desktop-tip="返回主界面" data-desktop-placement="right" hidden>‹</button><div class="page-heading"><p class="page-eyebrow" hidden></p><h2>会话管理 <span class="count-badge" id="sessions-count" aria-live="polite" aria-label="正在读取本机会话">—</span></h2></div></div>
                <div class="toolbar-group desktop-sessions-tools">
                  <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-search" id="sessions-search-toggle" type="button" aria-label="展开搜索" data-desktop-tip="搜索会话">⌕</button>
                  <span class="desktop-sessions-searchbox" id="sessions-searchbox" hidden><input class="search-field" id="sessions-search" type="search" placeholder="搜索会话……" aria-label="搜索会话"><button class="icon-button" id="sessions-search-clear" type="button" aria-label="关闭搜索">×</button></span>
                  <select class="select" id="sessions-source" aria-label="筛选会话来源" title="筛选会话来源"><option value="all">全部来源</option><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="deepseek">DeepSeek 网页</option><option value="gemini">Gemini 网页</option><option value="kimi">Kimi 网页</option><option value="universal">网页录入</option></select>
                  <select class="select" id="sessions-limit" aria-label="每类来源显示条数" title="每类来源显示条数"><option value="10">每类 10 条</option><option value="30" selected>每类 30 条</option><option value="50">每类 50 条</option></select>
                  <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-refresh" id="sessions-refresh" type="button" aria-label="刷新本地会话和网页录入" data-desktop-tip="刷新本地会话和网页录入"><span class="desktop-sessions-refresh-glyph" aria-hidden="true">↻</span></button>
                  <button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-sync-code" id="sessions-refresh-local" type="button" aria-label="同步 Codex / Claude" data-desktop-tip="同步 Codex / Claude">同步 Codex / Claude</button>
                  <button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-import" id="sessions-import-browser-sessions" type="button" aria-label="手动导入会话库" data-desktop-tip="手动导入会话库">手动导入会话库</button>
                  <button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-capture" id="sessions-capture-current-page" type="button" aria-label="录入当前界面" data-desktop-tip="录入当前界面">录入当前界面</button>
                  <button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-batch" id="sessions-bulk" type="button" aria-pressed="false" aria-label="批量管理" data-desktop-tip="批量管理">批量管理</button>
                </div>
              </header>
              <div class="desktop-sessions-batch" id="sessions-batchbar" hidden>
                <div><strong id="sessions-selected">已选 0 项</strong><span class="muted"></span></div>
                <div class="desktop-sessions-batch-actions" id="sessions-batch-actions"><button class="text-button" id="sessions-select-visible" type="button">全选当前</button><button class="text-button" id="sessions-clear-selected" type="button">清空已选</button><button class="danger-button" id="sessions-batch-delete" type="button" disabled>移除所选会话</button></div>
                <div class="desktop-sessions-batch-confirm" id="sessions-batch-confirm" hidden><span>从 Memorive 移除？源会话将保留。</span><button class="soft-button" id="sessions-batch-cancel" type="button">取消</button><button class="danger-button" id="sessions-batch-commit" type="button">确认移除 0 项 · 10</button></div>
              </div>
              <div class="desktop-sessions-stage" id="sessions-stage">
                <section class="desktop-sessions-listpane" id="sessions-listpane" aria-label="会话列表"><div class="desktop-sessions-setup-required warning-banner" id="sessions-browser-setup-required" role="status" hidden><strong>连接浏览器以录入网页会话</strong><span></span></div><div class="desktop-sessions-list" id="sessions-list"></div><div class="desktop-sessions-empty" id="sessions-empty" role="status"><strong>正在读取本机会话…</strong><span></span></div></section>
                <button class="desktop-sessions-detail-resizer" id="sessions-detail-resizer" type="button" role="separator" aria-label="调整一级列表与会话详情宽度，默认 40% / 60%" aria-controls="sessions-detail" aria-orientation="vertical" aria-valuemin="320" aria-valuemax="760" aria-valuenow="600" aria-valuetext="一级列表 40% · 会话详情 60%" hidden></button>
                <section class="desktop-sessions-detail" id="sessions-detail" aria-label="会话详情" aria-hidden="true" hidden>
                  <header class="desktop-sessions-detail-head">
                    <div class="desktop-sessions-detail-heading"><button class="icon-button desktop-sessions-back" id="sessions-close" type="button" aria-label="返回会话列表">&lt;</button><div class="desktop-sessions-detail-identity"><p class="page-eyebrow" id="sessions-detail-source">SOURCE · READ ONLY</p><h3 id="sessions-detail-title" tabindex="-1">会话</h3><div class="desktop-sessions-detail-meta"><span id="sessions-detail-time">—</span><span class="mono" id="sessions-detail-dir-wrap"><span id="sessions-detail-dir">—</span></span><span class="mono" id="sessions-detail-key">—</span><span id="sessions-detail-model-wrap"><span id="sessions-detail-model">—</span></span><span class="badge" id="sessions-partial" hidden>部分记录</span></div></div></div>
                    <div class="desktop-sessions-detail-tools">
                      <button class="primary-button" id="sessions-refine" type="button" hidden>精炼对话</button>
                      <span id="sessions-delete-start" hidden><button class="danger-button" id="sessions-delete" type="button">移除本地记录</button></span>
                      <span class="badge" id="sessions-readonly">此来源只读</span>
                      <span class="desktop-sessions-delete-confirm" id="sessions-delete-confirm" hidden><span>从 Memorive 移除？源会话将保留。</span><button class="soft-button" id="sessions-delete-cancel" type="button">取消</button><button class="danger-button" id="sessions-delete-commit" type="button">确认移除 · 10</button></span>
                    </div>
                  </header>
                  <div class="desktop-sessions-conversation">
                    <div class="desktop-sessions-refine-state" id="sessions-refine-state" hidden><span id="sessions-refine-state-text"></span><button class="icon-button" id="sessions-open-library" type="button" aria-label="在资料库打开这一版" data-desktop-tip="在资料库打开这一版" hidden>›</button></div>
                    <div class="desktop-sessions-view-switch" id="sessions-view-switch" hidden><div class="segmented" role="tablist" aria-label="会话视图"><button type="button" role="tab" id="sessions-show-turns" aria-selected="true" aria-pressed="true" aria-controls="sessions-turns">原对话</button><button type="button" role="tab" id="sessions-show-brief" aria-selected="false" aria-pressed="false" aria-controls="sessions-refinement-draft" tabindex="-1">精炼结果</button></div><span class="desktop-sessions-refinement-runs" id="sessions-refinement-runs"></span></div>
                    <section class="desktop-sessions-refinement-draft" id="sessions-refinement-draft" role="tabpanel" aria-label="对话精炼草稿" hidden><header><strong>精炼草稿 · 待复核</strong><button class="icon-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-history" id="sessions-edit-history" type="button" aria-label="历史版本" aria-pressed="false" data-desktop-tip="历史版本" hidden></button></header><div id="sessions-refinement-items"></div><section class="memo-history-pane desktop-sessions-edit-history" id="sessions-edit-history-panel" aria-label="历史版本" hidden></section></section>
                    <div class="desktop-sessions-turns" id="sessions-turns" aria-live="polite"><div class="desktop-sessions-turn-placeholder">正在读取会话正文…</div></div>
                    <div class="warning-banner" id="sessions-delete-help" hidden>此来源不允许在 Memorive 中删除或修改。</div>
                  </div>
                </section>
              </div>
              <div class="toast" id="sessions-toast" role="status" hidden><span id="sessions-toast-copy">会话状态已更新。</span><button class="text-button" type="button">关闭</button></div>
            </div>
          </div>
          <div class="desktop-blank-state" id="desktop-blank-state"><div class="desktop-home-prompt"><p class="desktop-home-speech">想构建什么呢？</p><button class="desktop-home-expression-button" type="button" data-expression="interaction" aria-label="播放疑问表情"><span class="desktop-home-expression-image" aria-hidden="true"></span></button></div></div>
          <div class="desktop-page-placeholder" id="desktop-page-placeholder" hidden><div class="desktop-page-symbol" aria-hidden="true"><svg class="desktop-icon" viewBox="0 0 24 24"><use href="#desktop-icon-layout-top"></use></svg></div><div class="desktop-page-copy" id="desktop-page-copy"><h1 id="desktop-page-title">页面</h1><p>请打开对应 Part 的独立预览文件</p></div></div>
        </main>

        <aside class="desktop-right-panel" id="desktop-right-panel" aria-label="全局右侧上下文面板" aria-hidden="true"><div class="inspector-inner"><div class="inspector-head"><div><p class="inspector-kicker">PAGE CONTEXT</p><h3>全局上下文</h3></div></div><p>完整会话使用中央宽阅读区；本页不把正文压入窄检查器。</p></div></aside>

        <button class="desktop-resizer desktop-right-resizer" id="desktop-resize-right" type="button" role="separator" aria-label="调整右侧面板宽度" aria-controls="desktop-right-panel" aria-orientation="vertical" aria-valuemin="160" aria-valuemax="440" aria-valuenow="260" hidden></button>
</div>
</section>
