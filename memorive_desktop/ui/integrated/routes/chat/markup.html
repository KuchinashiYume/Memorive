<!-- The research Q&A route: the conversation list, the thread with its answers and evidence, the composer, and the
     settings and evidence panels of the chat. Includes the window frame from shared/frame/. -->
<section class="desktop-route-surface" data-desktop-route="chat" aria-label="研究问答" hidden>

<div id="desktop-chat-preview" class="desktop-page-root" lang="zh-Hans">
  <!-- include: shared/frame/icons.html -->

  

  <div class="desktop-preview-stage" id="desktop-preview-stage">
    <section class="desktop-window" id="desktop-window" data-left="true" data-right="false" data-bottom="false" data-short-height="false" aria-label="Memorive 资料库">
      <!-- include: shared/frame/global-bar.html -->

      <div class="desktop-workspace">
        <!-- include: shared/frame/navigation.html -->

        <main class="desktop-central" id="desktop-central"><div class="desktop-page-view" id="desktop-page-view"><div class="memo-page" id="memo-chat-page">
  <header class="memo-heading page-header">
    <div class="desktop-page-heading-with-back"><button class="icon-button desktop-main-back" id="desktop-return-main" type="button" aria-label="返回主界面" data-desktop-tip="返回主界面" data-desktop-placement="right">‹</button><div class="page-heading"><h2>研究问答</h2><span id="memo-current-label" hidden></span></div></div>
    <div class="toolbar-group memo-heading-tools">
      <label class="memo-search" id="memo-search-wrap" hidden><input type="search" id="memo-thread-search" placeholder="搜索对话标题与内容" aria-label="搜索对话标题与内容" maxlength="500"></label>
      <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-search" id="memo-search-toggle" type="button" aria-label="搜索对话" aria-expanded="false" aria-controls="memo-search-wrap" data-desktop-tip="搜索对话  Ctrl+K" data-desktop-placement="bottom">搜索对话</button>
      <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-folder-open" id="memo-history-toggle" type="button" aria-label="项目与对话" aria-expanded="true" aria-controls="memo-threads" data-desktop-tip="显示或隐藏项目与对话" data-desktop-placement="bottom">项目与对话</button>
      <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-preview" id="memo-evidence-toggle" type="button" aria-label="引用与知识审核" aria-expanded="false" aria-controls="memo-evidence-panel" data-desktop-tip="显示或隐藏引用与知识审核" data-desktop-placement="bottom">引用与知识审核</button>
      <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-code" id="memo-handoff" type="button" aria-label="交给 Agent" data-desktop-tip="交给 Agent 继续研究" data-desktop-placement="bottom">交给 Agent</button>
    </div>
  </header>
  <div class="memo-layout" id="memo-layout" data-history="true" data-evidence="false">
    <aside class="memo-conversations" aria-label="项目与对话">
      <div class="memo-tree-heading"><span>项目</span><button type="button" id="memo-tree-new-project" class="icon-button memo-icon-action" aria-label="新建项目" data-desktop-tip="新建项目" data-desktop-placement="bottom">＋</button></div>
      <select id="memo-project" hidden aria-label="当前研究项目"></select><div class="memo-threads" id="memo-threads"></div>
      <div class="memo-sidebar-bottom"><button class="memo-sidebar-action" id="memo-archive-toggle" type="button" aria-pressed="false">已归档对话</button><span id="memo-thread-count" class="memo-status"></span></div>
    </aside>
    <section class="memo-chat" aria-label="对话">
      <div class="memo-chat-toolbar"><div class="memo-thread-heading"><button class="icon-button desktop-settings-back" id="memo-back-overview" type="button" aria-label="返回研究问答" data-desktop-tip="返回研究问答" data-desktop-placement="bottom">‹</button><div id="memo-thread-heading-copy"><span class="memo-project-crumb" id="memo-project-crumb"></span><h3 id="memo-thread-title">新对话</h3></div></div><button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-more memo-thread-toolbar-menu" id="memo-thread-menu" type="button" aria-label="当前对话操作" data-desktop-tip="当前对话操作" data-desktop-placement="bottom">当前对话操作</button></div>
      <div class="memo-local-banner" id="memo-local-banner" hidden><span>交接包已准备好。你可以在这里继续提问。</span><button class="memo-quiet-button" id="memo-resume-local" type="button">继续本机对话</button></div>
      <div class="memo-transcript" id="memo-transcript" role="log" aria-live="polite"></div>
      <form class="memo-composer" id="memo-composer"><div class="memo-input-shell" id="memo-input-shell"><div class="memo-attachments" id="memo-attachments" hidden></div><label for="memo-question" class="sr-only">输入研究问题</label><textarea id="memo-question" placeholder="在当前项目中提问…" maxlength="8000" aria-label="输入研究问题"></textarea>
        <div class="memo-composer-bar"><div class="memo-composer-tools"><button id="memo-add-file" class="icon-button memo-add-file" type="button" aria-label="添加资料" data-desktop-tip="添加资料">＋</button><button id="memo-composer-model" class="memo-model-button" type="button" aria-haspopup="menu" aria-expanded="false"><span id="memo-model-label">仅检索</span><span aria-hidden="true">⌄</span></button><button id="memo-composer-scope" class="memo-quiet-button" type="button" data-desktop-tip="选择提问使用的资料范围">当前项目</button></div><div class="memo-actions"><button class="soft-button" id="memo-stop" type="button" hidden>停止</button><button class="primary-button memo-send-button" id="memo-send" type="submit" aria-label="发送问题" data-desktop-tip="按 Enter 发送" data-desktop-placement="bottom"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 11 5-5 5 5M12 6v12"/></svg></button></div></div></div>
        <div id="memo-composer-model-menu" class="desktop-settings-model-menu memo-composer-model-menu" role="menu" aria-hidden="true" data-open="false"></div><input type="checkbox" id="memo-temporary" hidden aria-label="临时对话"><div class="memo-status" id="memo-chat-status" role="status"></div>
      </form>
    </section>
    <button class="desktop-resizer desktop-right-resizer memo-evidence-resizer" id="memo-evidence-resizer" type="button" role="separator" aria-label="调整引用与知识审核栏宽度" aria-controls="memo-evidence-panel" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="520" aria-valuenow="340" aria-valuetext="340 像素"></button>
    <aside class="memo-evidence" id="memo-evidence-panel" aria-label="引用与知识审核">
      <div class="memo-evidence-heading"><div class="segmented memo-evidence-tabs" id="memo-evidence-tabs" role="tablist" aria-label="引用与知识审核">
        <button type="button" id="memo-material-tab" role="tab" data-memo-evidence-tab="materials" aria-selected="true" aria-pressed="true">资料</button><button type="button" id="memo-reference-tab" role="tab" data-memo-evidence-tab="references" aria-selected="false" aria-pressed="false" aria-controls="memo-reference-panel">引用</button><button type="button" id="memo-feedback-tab" role="tab" data-memo-evidence-tab="feedback" aria-selected="false" aria-pressed="false" aria-controls="memo-feedback-panel">知识</button>
      </div><button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-refresh" id="memo-refresh-index" type="button" aria-label="刷新引用索引" data-desktop-tip="刷新当前项目资料索引" data-desktop-placement="bottom">刷新索引</button></div>
      <section class="memo-evidence-content" id="memo-material-panel" role="tabpanel" aria-labelledby="memo-material-tab"><div class="memo-material-toolbar"><button class="icon-button" id="memo-add-materials" type="button" aria-label="添加文件" data-desktop-tip="添加文件">＋</button></div><div class="memo-evidence-scroll" id="memo-material-list"></div><div class="memo-evidence-scroll" id="memo-material-detail" hidden></div></section><section class="memo-evidence-content" id="memo-reference-panel" hidden role="tabpanel" aria-labelledby="memo-reference-tab"><div class="memo-evidence-scroll" id="memo-evidence-list"></div><div class="memo-evidence-actions" hidden><button class="soft-button" id="memo-tension" type="button" data-desktop-tip="比较所选文献并准备张力分析" data-desktop-placement="bottom">准备张力分析</button><button class="soft-button" id="memo-propose" type="button" data-desktop-tip="将所选证据整理为待审核知识" data-desktop-placement="bottom">知识回流</button></div></section>
      <section class="memo-evidence-content" id="memo-feedback-panel" role="tabpanel" aria-labelledby="memo-feedback-tab" hidden><div class="memo-evidence-scroll" id="memo-feedback-list" aria-label="知识回流草稿与审核结果"></div></section>
      <div class="memo-status" id="memo-evidence-status" role="status"></div>
    </aside>
  </div>
  <template id="memo-empty-template"><div class="memo-empty"><div class="desktop-home-prompt"><p class="desktop-home-speech">有什么问题吗？</p><button class="desktop-home-expression-button" type="button" data-expression="question" aria-label="开始提问"><img class="desktop-home-expression-image" src="assets/decorations/home-question.svg" alt="" draggable="false"></button></div></div></template>
  <dialog class="memo-dialog memo-project-materials-dialog" id="memo-project-materials-dialog" aria-labelledby="memo-project-materials-title">
    <header><h3 id="memo-project-materials-title">研究问答项目资料</h3><button class="icon-button" id="memo-project-materials-close" type="button" aria-label="关闭研究问答项目资料" data-desktop-tip="关闭研究问答项目资料" data-desktop-placement="bottom">×</button></header>
    <div class="memo-dialog-body" id="memo-project-materials-host">
      <section id="memo-settings-project-panel" aria-labelledby="memo-settings-project-title">
        <div class="memo-settings-section-heading"><h3 id="memo-settings-project-title" tabindex="-1">研究问答项目与资料</h3><p>每个研究问答项目使用独立资料范围；这里添加的文件不会自动进入主资料库。</p></div>
        <div class="desktop-settings-form-stack">
          <div class="desktop-settings-form-group"><label class="field-label" for="memo-settings-project"><span>当前项目</span></label><div class="desktop-settings-inline memo-settings-inline"><select class="select" id="memo-settings-project"></select></div><label class="field-label" for="memo-project-name"><span>项目名称</span><input class="field" id="memo-project-name" maxlength="160" autocomplete="off"></label></div>
          <div class="desktop-settings-form-group"><label class="field-label" for="memo-vault"><span>Vault 或资料文件夹</span></label><div class="desktop-settings-inline memo-settings-inline"><input class="field" id="memo-vault" readonly placeholder="尚未选择资料文件夹"><button class="soft-button" id="memo-pick-vault" type="button">选择文件夹</button></div><p class="memo-settings-note">来源变化后，旧引用会标记失效；更新索引以读取最新内容。</p></div>
          <div class="memo-actions"><button class="primary-button" id="memo-save-project" type="button">保存项目并更新索引</button><button class="soft-button" id="memo-reindex" type="button">更新索引</button><button class="soft-button" id="memo-library-add" type="button">从 Memo 资料库添加</button></div><div class="memo-status" id="memo-index-status" role="status" aria-live="polite"></div>
        </div>
      </section>
    </div>
  </dialog>
</div>
</div><div id="desktop-blank-state" hidden></div><div id="desktop-page-placeholder" hidden></div></main>

        <aside class="desktop-right-panel" id="desktop-right-panel" aria-label="资料档案详情" aria-hidden="true">
          <div class="inspector-inner">
            <div class="inspector-head desktop-library-inspector-head">
              <div class="desktop-library-inspector-heading"><button class="icon-button desktop-library-back" id="library-close" type="button" aria-label="返回资料列表" title="返回资料列表">&lt;</button><div class="desktop-library-inspector-identity"><p class="inspector-kicker" id="library-detail-type">资料档案</p><h3 id="library-detail-title" tabindex="-1">资料</h3></div></div>
              <div class="desktop-library-head-actions"><button class="text-button" id="library-refinement-locate" type="button" hidden>文件夹中定位</button><button class="text-button" id="library-refinement-open" type="button" hidden>打开结果 ↗</button><button class="text-button" id="library-external" type="button" hidden>打开文件 ↗</button></div>
            </div>
            <section class="inspector-section"><h4>基本信息</h4><dl class="key-value"><dt>引用或类型</dt><dd id="library-detail-meta">—</dd><dt>最近活动</dt><dd id="library-detail-time">—</dd><dt>状态</dt><dd id="library-detail-status">—</dd></dl><details class="desktop-copy-technical"><summary>技术详情</summary><span class="mono" id="library-detail-id">—</span></details></section>
            <section class="inspector-section desktop-library-document-files" id="library-files-section"><div class="desktop-library-files" id="library-source-file"></div><div class="desktop-library-files" id="library-products"></div><p class="desktop-library-empty-copy" id="library-products-empty" hidden>尚无生成产物</p><p class="desktop-library-source-note" id="library-detail-source" hidden>—</p></section>
            <section class="inspector-section desktop-library-refinement" id="library-refinement-section" hidden><h4>会话精炼成品</h4><dl class="key-value"><dt>来源会话</dt><dd><button class="text-button mono desktop-library-inline-link" id="library-go-session" type="button">—</button></dd><dt>精炼条目</dt><dd id="library-refinement-items">—</dd></dl><details class="desktop-copy-technical"><summary>技术详情</summary><dl class="key-value"><dt>草稿校验</dt><dd><button class="text-button mono desktop-library-hash desktop-library-inline-link" id="library-refinement-draft-hash" type="button">—</button></dd><dt>来源快照</dt><dd><button class="text-button mono desktop-library-hash desktop-library-inline-link" id="library-refinement-source-hash" type="button">—</button></dd></dl></details><div class="desktop-library-review-row"><button class="soft-button" id="library-refinement-confirm" type="button" disabled>确认复核</button><span id="library-refinement-review-help">请先打开结果</span></div></section>
            <section class="inspector-section" id="library-task-section" hidden><h4>关联任务</h4><div class="desktop-library-task-row"><span id="library-task-copy">—</span><button class="text-button" id="library-go-task" type="button">前往</button></div><p></p></section>
          </div>
        </aside>

        <!-- include: shared/frame/accounting-panel.html -->

        <button class="desktop-resizer desktop-right-resizer" id="desktop-resize-right" type="button" role="separator" aria-label="调整一级列表与二级资料档案宽度，默认 60% / 40%" aria-controls="desktop-right-panel" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="760" aria-valuenow="498" hidden></button>
        <button class="desktop-resizer desktop-bottom-resizer" id="desktop-resize-bottom" type="button" role="separator" aria-label="调整底部面板高度" aria-controls="desktop-bottom-panel" aria-orientation="horizontal" aria-valuemin="240" aria-valuemax="528" aria-valuenow="346" hidden></button>
      </div>

      <div class="desktop-tooltip" id="desktop-tooltip" role="tooltip" hidden></div>
      <div class="sr-only" id="desktop-live-state" aria-live="polite"></div>
    </section>
  </div>
</div>
  
  





  
  

</section>
