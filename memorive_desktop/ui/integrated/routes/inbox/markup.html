<!-- The inbox route, also the start view: the item list, the batch bar, the drop target, the item details in the
     right panel, and the home view with the assistant picture. The window frame around it is in page.html. -->
<section class="desktop-route-surface" data-desktop-route="inbox" aria-label="收件箱" hidden>
<div id="desktop-inbox-preview" class="desktop-page-root" lang="zh-Hans">
        <main class="desktop-central" id="desktop-central">
          <div class="desktop-page-view" id="desktop-page-view" hidden>
            <div class="page-shell desktop-inbox-shell">
              <header class="page-header desktop-inbox-header">
                <div class="desktop-page-heading-with-back"><button class="icon-button desktop-main-back" id="desktop-return-main" type="button" aria-label="返回主界面" data-desktop-tip="返回主界面" data-desktop-placement="right" hidden>‹</button><div class="page-heading"><p class="page-eyebrow" hidden></p><h2>收件箱 <span class="count-badge desktop-inbox-queue-count" id="inbox-queued" aria-label="已排队 0 项" data-desktop-tip="已排队 0 · 处理中 0 · 异常 0 · 导入中 0" data-desktop-placement="bottom">0</span></h2></div></div>
                <div class="desktop-inbox-tools" aria-label="收件箱操作">
                  <div class="desktop-inbox-tool-group desktop-inbox-add-group"><button class="primary-button desktop-toolbar-icon desktop-toolbar-primary desktop-action-file-plus" id="inbox-add" type="button" aria-label="添加一个或多个文件" data-desktop-tip="添加文件">▣ 添加文件</button></div>
                  <span class="desktop-inbox-tool-divider" aria-hidden="true"></span>
                  <div class="desktop-inbox-tool-group desktop-inbox-bulk-group"><button class="soft-button desktop-toolbar-icon desktop-toolbar-soft desktop-action-batch" id="inbox-bulk" type="button" aria-pressed="false" aria-label="批量管理" data-desktop-tip="批量管理">批量管理</button></div>
                  <span class="desktop-inbox-tool-divider" aria-hidden="true"></span>
                  <div class="desktop-inbox-tool-group desktop-inbox-history-group">
                    <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-undo" id="inbox-undo" type="button" aria-label="撤销移除" data-desktop-tip="撤销移除  Ctrl+Z" data-desktop-placement="bottom" disabled>↶</button>
                    <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-redo" id="inbox-redo" type="button" aria-label="重做移除" data-desktop-tip="重做移除  Ctrl+Y" data-desktop-placement="bottom" disabled>↷</button>
                    <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-refresh" id="inbox-refresh" type="button" aria-label="刷新收件箱" data-desktop-tip="刷新收件箱" data-desktop-placement="bottom">↻</button>
                  </div>
                  <span class="desktop-inbox-tool-divider" aria-hidden="true"></span>
                  <div class="desktop-inbox-auto"><button class="desktop-inbox-warning-dot" id="inbox-auto-warning" type="button" aria-label="自动执行不可用原因" data-desktop-tip="正式执行 route 当前未获启用；手动导入、预览与文件操作仍可用" data-desktop-placement="bottom">!</button><button class="switch desktop-toolbar-icon desktop-toolbar-toggle desktop-action-auto" id="inbox-auto" type="button" role="switch" aria-checked="false" aria-label="自动执行当前不可用" data-desktop-tip="自动执行" disabled></button></div>
                </div>
              </header>
              <div class="desktop-inbox-batch" id="inbox-batchbar" hidden><div><strong>批量操作</strong><span class="muted" id="inbox-selection"> · 已选 0 项</span></div><div class="toolbar-group"><button class="text-button" id="inbox-select-all" type="button">全选当前</button><button class="text-button" id="inbox-clear-selection" type="button" disabled>清空已选</button><button class="soft-button" id="inbox-star-selected" type="button" disabled>加星</button><button class="soft-button" id="inbox-unstar-selected" type="button" disabled>取消星标</button><button class="danger-button" id="inbox-remove-selected" type="button" disabled>批量移除</button></div></div>
              <div class="page-body desktop-inbox-body" id="inbox-body">
                <div class="desktop-inbox-list" id="inbox-list">
                  <article class="desktop-inbox-card new-file importing-progress" aria-disabled="true" hidden><div></div><div><strong>new file</strong><small>正在复制… <span class="desktop-inbox-progress-copy">0%</span></small><span class="desktop-inbox-progress"><i style="width:0%"></i></span></div><div></div><div></div></article>
                  <article class="desktop-inbox-card new-file importing-indeterminate" aria-disabled="true" hidden><div></div><div><strong>new file</strong><small><span class="status-spinner"></span> 正在复制</small></div><div></div><div></div></article>
<div class="empty-state desktop-inbox-empty" id="inbox-empty"><div><strong>收件箱为空</strong><span></span></div></div>
                </div>
                <div class="desktop-inbox-drop" id="inbox-drop" hidden><div><strong>释放以添加</strong><span></span></div></div>
                <div class="desktop-inbox-context" id="inbox-context" role="menu" hidden><button type="button" role="menuitem" data-open-action="preview">预览</button><button type="button" role="menuitem" data-open-action="folder">在文件管理器中定位</button><button type="button" role="menuitem" data-open-action="external">Research Vault ↗</button></div>
              </div>
              <div class="toast" id="inbox-toast" hidden><span id="inbox-toast-copy">已移除 1 项，可在本次会话撤销。</span><button class="text-button" id="inbox-toast-undo" type="button">撤销</button></div>
            </div>
          </div>
          <div class="desktop-blank-state" id="desktop-blank-state"><div class="desktop-home-prompt"><p class="desktop-home-speech">想构建什么呢？</p><button class="desktop-home-expression-button" type="button" data-expression="interaction" aria-label="播放疑问表情"><img class="desktop-home-expression-image" src="assets/decorations/home-interaction.svg" alt="" draggable="false"></button></div></div>
          <div class="desktop-page-placeholder" id="desktop-page-placeholder" hidden>
            <div class="desktop-page-symbol" aria-hidden="true"><svg class="desktop-icon" viewBox="0 0 24 24"><use href="#desktop-icon-layout-top"></use></svg></div>
            <div class="desktop-page-copy" id="desktop-page-copy"><h1 id="desktop-page-title">页面</h1><p>请打开对应 Part 的独立预览文件</p></div>
          </div>
        </main>

        <aside class="desktop-right-panel" id="desktop-right-panel" aria-label="收件箱项目详情面板" aria-hidden="true"><div class="inspector-inner"><div class="inspector-head"><div><h3 id="inbox-detail-title">文件</h3></div><button class="icon-button desktop-detail-close" id="inbox-close-detail" type="button" aria-label="关闭详情" data-desktop-tip="关闭详情">×</button></div><div class="toolbar-group desktop-inbox-detail-actions"><button class="soft-button" id="inbox-locate" type="button">文件夹中定位</button><button class="text-button" id="inbox-external" type="button">系统默认程序 ↗</button><button class="primary-button" id="inbox-open-session" type="button" hidden>前往会话管理</button><button class="desktop-toolbar-icon desktop-toolbar-soft desktop-action-trash" id="inbox-delete-task" type="button" aria-label="删除任务" data-desktop-tip="删除任务" data-desktop-placement="bottom" disabled>删除任务</button></div><div class="desktop-inbox-logic-option" id="inbox-logic-analysis-option" hidden>
            <label class="desktop-inbox-logic-label" for="inbox-logic-analysis">
              <svg class="desktop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V5"></path><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"></path><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"></path><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"></path><path d="M18 18a4 4 0 0 0 2-7.464"></path><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"></path><path d="M6 18a4 4 0 0 1-2-7.464"></path><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"></path></svg>
              <span>逻辑分析</span>
              <input id="inbox-logic-analysis" type="checkbox" aria-describedby="inbox-logic-analysis-help">
            </label>
            <p id="inbox-logic-analysis-help">原文就绪后排队，使用已配置的云端模型。</p>
          </div><section class="inspector-section"><h4 id="inbox-properties-heading">文件属性</h4><dl class="key-value"><dt>文件类型</dt><dd id="inbox-detail-type">—</dd><dt>文件大小</dt><dd id="inbox-detail-size">—</dd><dt>文件状态</dt><dd id="inbox-detail-state">—</dd><dt>创建时间</dt><dd id="inbox-detail-created">—</dd><dt>修改时间</dt><dd id="inbox-detail-modified">—</dd><dt>文件路径</dt><dd class="mono" id="inbox-detail-path">—</dd></dl><details class="desktop-copy-technical"><summary>技术详情</summary><dl class="key-value"><dt>ID</dt><dd class="mono" id="inbox-detail-id">—</dd></dl></details></section><section class="inspector-section"><h4 id="inbox-preview-heading" hidden>预览</h4><div class="desktop-inbox-preview" id="inbox-preview"></div></section></div></aside>

        <button class="desktop-resizer desktop-right-resizer" id="desktop-resize-right" type="button" role="separator" aria-label="调整右侧面板宽度" aria-controls="desktop-right-panel" aria-orientation="vertical" aria-valuemin="160" aria-valuemax="900" aria-valuenow="40" aria-valuetext="内容区 40%" hidden></button>
</div>
</section>
