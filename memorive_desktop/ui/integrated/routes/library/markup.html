<!-- The library route: the list of processed papers, their files and details in the right panel.
     The window frame around it is in page.html. -->
<section class="desktop-route-surface" data-desktop-route="library" aria-label="资料库" hidden>
<div id="desktop-library-preview" class="desktop-page-root" lang="zh-Hans">
        <main class="desktop-central" id="desktop-central">
          <div class="desktop-page-view" id="desktop-page-view" hidden>
            <div class="page-shell desktop-library-shell">
              <header class="page-header">
                <div class="desktop-page-heading-with-back">
                  <button class="icon-button desktop-main-back" id="desktop-return-main" type="button" aria-label="返回主界面" data-desktop-tip="返回主界面" data-desktop-placement="right" hidden>‹</button>
                  <div class="page-heading">
                  <p class="page-eyebrow" hidden id="library-eyebrow">最近 30 天</p>
                  <h2 id="library-heading"><button class="desktop-page-title-switch" id="library-mode-title" type="button" aria-label="切换到 Memorive 文档" data-desktop-tip="切换到 Memorive 文档" data-desktop-placement="bottom">资料库 · <span id="library-mode-label">文献</span></button> <span class="count-badge" id="library-count">0</span></h2>
                  </div>
                </div>
                <div class="toolbar-group desktop-library-tools">
                  <button class="icon-button desktop-library-mode desktop-toolbar-icon desktop-toolbar-ghost desktop-action-library-switch" id="library-mode" type="button" data-mode="literature" aria-label="切换到 Memorive 文档" data-desktop-tip="切换到 Memorive 文档">
                    <svg class="desktop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="M4 4l5 5"></path></svg>
                  </button>
                  <div class="desktop-library-filter-wrap">
                    <button class="soft-button desktop-library-filter-button" id="library-filter-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="library-filter-menu"><span id="library-filter-label">全部状态</span><span aria-hidden="true">▾</span></button>
                    <div class="desktop-library-filter-menu" id="library-filter-menu" role="listbox" aria-label="文献状态" hidden>
                      <button type="button" role="option" aria-selected="true" data-filter="all">全部</button>
                      <button type="button" role="option" aria-selected="false" data-filter="pending">未处理</button>
                      <button type="button" role="option" aria-selected="false" data-filter="complete">已完成</button>
                      <button type="button" role="option" aria-selected="false" data-filter="error">异常</button>
                    </div>
                  </div>
                  <button class="icon-button desktop-toolbar-icon desktop-toolbar-ghost desktop-action-refresh" id="library-refresh" type="button" aria-label="刷新" data-desktop-tip="刷新最近 30 天资料">↻</button>
                </div>
              </header>
              <div class="page-body desktop-library-body">
                <div class="desktop-library-list" id="library-list"></div>
<div class="empty-state" id="library-empty"><div><strong id="library-empty-copy">最近 30 天没有文献活动</strong></div></div>
              </div>
              <div class="toast" id="library-toast" hidden><span id="library-toast-copy">正在资源管理器中定位精确文件。</span><button class="text-button" type="button">关闭</button></div>
            </div>
          </div>
          <div class="desktop-blank-state" id="desktop-blank-state"><div class="desktop-home-prompt"><p class="desktop-home-speech">想构建什么呢？</p><button class="desktop-home-expression-button" type="button" data-expression="interaction" aria-label="播放疑问表情"><span class="desktop-home-expression-image desktop-kaomoji" aria-hidden="true">(・ω&lt;)☆</span></button></div></div>
          <div class="desktop-page-placeholder" id="desktop-page-placeholder" hidden><div class="desktop-page-symbol" aria-hidden="true"><svg class="desktop-icon" viewBox="0 0 24 24"><use href="#desktop-icon-layout-top"></use></svg></div><div class="desktop-page-copy" id="desktop-page-copy"><h1 id="desktop-page-title">页面</h1><p>请打开对应 Part 的独立预览文件</p></div></div>
        </main>

        <aside class="desktop-right-panel" id="desktop-right-panel" aria-label="资料档案详情" aria-hidden="true">
          <div class="inspector-inner">
            <div class="inspector-head desktop-library-inspector-head">
              <div class="desktop-library-inspector-heading"><div class="desktop-library-inspector-identity"><p class="inspector-kicker" id="library-detail-type">资料档案</p><h3 id="library-detail-title" tabindex="-1">资料</h3></div></div>
              <div class="desktop-library-head-actions"><button class="text-button" id="library-refinement-locate" type="button" hidden>文件夹中定位</button><button class="text-button" id="library-refinement-open" type="button" hidden>打开结果 ↗</button><button class="text-button" id="library-external" type="button" hidden>打开文件 ↗</button></div><button class="icon-button desktop-detail-close" id="library-close" type="button" aria-label="关闭详情" data-desktop-tip="关闭详情">×</button>
            </div>
            <section class="inspector-section"><h4>基本信息</h4><dl class="key-value"><dt>引用或类型</dt><dd id="library-detail-meta">—</dd><dt>最近活动</dt><dd id="library-detail-time">—</dd><dt>状态</dt><dd id="library-detail-status">—</dd></dl><details class="desktop-copy-technical"><summary>技术详情</summary><span class="mono" id="library-detail-id">—</span></details></section>
            <section class="inspector-section desktop-library-document-files" id="library-files-section"><div class="desktop-library-files" id="library-source-file"></div><div class="desktop-library-files" id="library-products"></div><p class="desktop-library-empty-copy" id="library-products-empty" hidden>尚无生成产物</p><p class="desktop-library-source-note" id="library-detail-source" hidden>—</p></section>
            <section class="inspector-section desktop-library-refinement" id="library-refinement-section" hidden><h4>会话精炼成品</h4><dl class="key-value"><dt>来源会话</dt><dd><button class="text-button mono desktop-library-inline-link" id="library-go-session" type="button">—</button></dd><dt>精炼条目</dt><dd id="library-refinement-items">—</dd></dl><details class="desktop-copy-technical"><summary>技术详情</summary><dl class="key-value"><dt>草稿校验</dt><dd><button class="text-button mono desktop-library-hash desktop-library-inline-link" id="library-refinement-draft-hash" type="button">—</button></dd><dt>来源快照</dt><dd><button class="text-button mono desktop-library-hash desktop-library-inline-link" id="library-refinement-source-hash" type="button">—</button></dd></dl></details><div class="desktop-library-review-row"><button class="soft-button" id="library-refinement-confirm" type="button" disabled>确认复核</button><span id="library-refinement-review-help">请先打开结果</span></div></section>
            <section class="inspector-section" id="library-task-section" hidden><h4>关联任务</h4><div class="desktop-library-task-row"><span id="library-task-copy">—</span><button class="text-button" id="library-go-task" type="button">前往</button></div><p></p></section>
          </div>
        </aside>

        <button class="desktop-resizer desktop-right-resizer" id="desktop-resize-right" type="button" role="separator" aria-label="调整一级列表与二级资料档案宽度，默认 60% / 40%" aria-controls="desktop-right-panel" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="760" aria-valuenow="498" hidden></button>
</div>
</section>
