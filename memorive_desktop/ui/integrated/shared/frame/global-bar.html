      <header class="desktop-global-bar">
        <div class="desktop-global-left">
          <button class="desktop-icon-button" id="desktop-toggle-left" type="button" aria-label="切换边栏" aria-pressed="true" data-desktop-tip="切换边栏  Ctrl+B" data-desktop-placement="bottom">
            <svg class="desktop-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#desktop-icon-panel-left"></use></svg>
          </button>
          <span class="desktop-app-title">Memorive</span>
          <span class="desktop-view-name" id="desktop-view-name">主体界面</span>
        </div>
        <div class="desktop-global-right">
          <button class="desktop-icon-button" id="desktop-toggle-bottom" type="button" aria-label="切换底部面板显示" aria-pressed="false" data-desktop-tip="切换底部面板显示  Ctrl+J" data-desktop-placement="bottom">

          </button>
          <button class="desktop-icon-button" id="desktop-toggle-right" type="button" aria-label="显示或隐藏侧边面板" aria-pressed="false" data-desktop-tip="显示/隐藏侧边面板  Ctrl+Alt+B" data-desktop-placement="bottom">
            <svg class="desktop-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#desktop-icon-panel-right"></use></svg>
          </button>
        </div>
      </header>
