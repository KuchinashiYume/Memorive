          <section class="wizard-page" aria-labelledby="pageTitle">

                        <strong id="keepLabel">保留个人数据（推荐）</strong>

        </section></div><div class="sr-only" id="liveRegion" role="status" aria-live="polite"></div><script>(() => {
  'use strict';

  let seq=0,busy=false;const pending=new Map();
  function call(action,args={}){return new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});window.chrome.webview.postMessage({id,action,args});});}
  function announce(text){$('liveRegion').textContent=text;}
  function focusHeading(){$('pageTitle').focus({preventScroll:true});}
      function setProgress(value) {
      state.progress = value;
      $('progressPercent').textContent = `${value}%`;
      $('progressBar').style.width = `${value}%`;
      $('progressTrack').setAttribute('aria-valuenow', String(value));
    }
    function reflectPolicy() {
      const deleting = state.policy === 'delete';
      $('keepData').checked = !deleting;
      $('deleteData').checked = deleting;
      $('keepChoice').classList.toggle('is-selected', !deleting);
      $('deleteChoice').classList.toggle('is-selected', deleting);
      $('choiceNote').className = 'choice-note' + (deleting ? ' danger' : state.note ? ' attention' : '');
      $('choiceNoteIcon').toggleAttribute('hidden', !deleting && !state.note);
      $('choiceNoteText').textContent = deleting
        ? '点击“开始卸载”后，需核对清单并再次确认永久删除。'
        : state.note || '程序文件与个人数据分开保存。';
      if (state.view === 'data') {
        primary.className = 'button ' + (deleting ? 'button-danger' : 'button-primary');
        primary.setAttribute('aria-describedby', 'choiceNoteText');
      }
    }
    function render(focus = true) {
      stage.hidden = state.closed;
      if (state.closed) return;
      
      views.forEach(id => { $(id).hidden = true; });
      primary.hidden = false;
      secondary.hidden = false;
      primary.disabled = false;
      secondary.disabled = false;
      primary.className = 'button button-primary';
      secondary.className = 'button button-secondary';
      primary.removeAttribute('aria-describedby');
      closeButton.disabled = false;
      $('footerNote').textContent = '';
      let title = '';
      let subtitle = '';
      let step = 2;
      let viewId = 'dataView';

      switch (state.view) {
        case 'welcome':
          title = '卸载 Memorive'; subtitle = 'Memorive 将从此电脑中卸载。'; step = 1; viewId = 'welcomeView';
          primary.textContent = '下一步'; secondary.textContent = '取消';
          break;
        case 'data':
          title = '保留您的数据'; subtitle = '卸载 Memorive 时，您可以选择是否保留个人数据。';
          primary.textContent = '开始卸载'; secondary.textContent = '上一步';
          reflectPolicy();
          break;
        case 'working':
          title = '正在卸载 Memorive'; subtitle = '请稍候。'; viewId = 'progressView';
          primary.hidden = true;
          secondary.textContent = '取消'; secondary.disabled = state.finalizing;
          closeButton.disabled = state.finalizing;
          $('progressLabel').textContent = state.finalizing ? '正在完成卸载' : '正在卸载';
          $('progressNote').textContent = state.policy === 'keep' ? '您的个人数据将被保留。' : '仅在卸载成功后删除您选择的个人数据。';
          $('footerNote').textContent = state.finalizing ? '即将完成，请稍候。' : '';
          break;
        case 'stopping':
          title = '正在停止卸载'; subtitle = '请稍候。'; viewId = 'progressView';
          primary.hidden = true; secondary.textContent = '正在停止'; secondary.disabled = true; closeButton.disabled = true;
          $('progressLabel').textContent = '正在安全停止';
          $('progressNote').textContent = '您的程序和个人数据将保持不变。';
          break;
        case 'blocked':
          title = '无法开始卸载'; viewId = 'blockedView';
          primary.textContent = state.checking ? '检查中…' : '重新检查'; primary.disabled = state.checking;
          secondary.textContent = '取消';
          break;
        case 'failed':
          title = '卸载未完成'; viewId = 'failedView';
          primary.textContent = '重试'; secondary.textContent = '完成';
          break;
        case 'complete':
          title = 'Memorive 已卸载'; step = 3; viewId = 'completeView';
          primary.textContent = '完成'; secondary.hidden = true;
          $('dataResult').textContent = state.policy === 'keep'
            ? '您的个人数据已保留。' : '您选择的个人数据已删除。';
          break;
        default:
          return;
      }
      $(viewId).hidden = false;
      $('pageTitle').textContent = title;
      $('pageSubtitle').textContent = subtitle;
      $('stepCount').textContent = `${step} / 3`;
      $('stepCount').setAttribute('aria-label', `第 ${step} 步，共 3 步`);
      app.setAttribute('aria-busy', String(['working', 'stopping'].includes(state.view)));
      if (focus) { focusHeading(); announce(title); }
    }
    function show(view, focus = true) { state.view = view; render(focus); call('uiState',{view}).catch(()=>{}); }

  async function showData(){try{await call('removalCheck');state.policy='keep';state.note='';show('data');}catch(e){showError(e,true);}}
  function showError(e,blocked=false){state.finalizing=false;show(blocked?'blocked':'failed');const v=$(blocked?'blockedView':'failedView');v.querySelector('.message-primary').textContent=blocked?'无法开始卸载':'Memorive 未能完全卸载。';let p=v.querySelector('.message-secondary');if(!p){p=document.createElement('p');p.className='message-secondary';v.append(p);}p.textContent=e.message;}
  async function start(){if(busy)return;try{const plan=await call('removalPlan',{policy:state.policy});if(state.policy==='delete'){const confirmed=await call('confirmDeletion',{hash:plan.hash});if(!confirmed){state.policy='keep';state.note='未确认删除；个人数据将保留。';reflectPolicy();return;}}busy=true;state.finalizing=false;setProgress(0);show('working');await call('remove',{hash:plan.hash,policy:state.policy});setProgress(100);state.finalizing=false;show('complete');}catch(e){if(e.message==='卸载已取消，程序和个人数据均未更改。'){state.policy='keep';state.note=e.message;show('data');}else showError(e);}finally{busy=false;call('uiState',{view:state.view}).catch(()=>{});}}
  async function close(){if(busy){if(!state.finalizing)await call('cancel');return;}await call('close');}
  primary.addEventListener('click',()=>{if(primary.disabled)return;if(state.view==='welcome'||state.view==='blocked'||state.view==='failed')showData();else if(state.view==='data')start();else if(state.view==='complete')close();});
  secondary.addEventListener('click',()=>{if(secondary.disabled)return;if(state.view==='data')show('welcome');else close();});
  closeButton.addEventListener('click',close);app.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}});
  ['keepData','deleteData'].forEach(id=>$(id).addEventListener('change',()=>{if(state.view==='data'){state.policy=$('deleteData').checked?'delete':'keep';state.note='';reflectPolicy();}}));
  window.chrome.webview.addEventListener('message',event=>{const m=event.data;if(m.event==='progress'){state.finalizing=m.finalizing;setProgress(m.percent);render(false);$('progressLabel').textContent=m.message;return;}if(m.event==='closeRequest'){close();return;}const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.ok?p.resolve(m.value):p.reject(new Error(m.error));});
  call('init').then(()=>{render(false);return call('uiState',{view:'welcome'});}).catch(e=>showError(e,true));
})();
</script></body></html>
